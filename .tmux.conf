# ~/.tmux.conf — managed in ~/dotfiles, symlinked by install.sh
# Prefix stays at the default Ctrl-b.

# ---- Usability ----------------------------------------------------------
set -g mouse on                   # click panes/windows, drag borders, scroll
set -g base-index 1               # windows start at 1 (matches keyboard)
setw -g pane-base-index 1
set -g renumber-windows on        # no gaps after closing a window
set -g history-limit 50000        # scrollback per pane
set -g display-time 2000

# Reload this file: prefix r
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# ---- Neovim -------------------------------------------------------------
set -sg escape-time 10            # no lag after Esc
set -g focus-events on            # autoread / auto-save.nvim on focus change
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"   # true color (catppuccin)

# ---- Clipboard over SSH (OSC 52) ----------------------------------------
# Yanks in tmux copy mode (and Neovim with osc52) reach the Mac's clipboard.
# iTerm2: Settings > General > Selection > "Applications in terminal may access clipboard".
set -g set-clipboard on

# ---- Copy mode (prefix [) with Vim keys --------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ---- Splits / windows open in the current directory ---------------------
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window      -c "#{pane_current_path}"

# ---- Projects -----------------------------------------------------------
# prefix f: fuzzy-pick a session or a ~/code project (opens it with `dev`)
bind f display-popup -E -w 70% -h 60% "~/dotfiles/bin/tmux-sessionizer"

# ---- Plugins (tpm) ------------------------------------------------------
# install.sh clones tpm. Inside tmux: prefix I installs, prefix U updates.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # prefix Ctrl-s save, prefix Ctrl-r restore
set -g @plugin 'tmux-plugins/tmux-continuum'   # auto-save every 15 min
set -g @continuum-restore 'on'                 # restore sessions after a reboot

# Keep this line at the very bottom
run '~/.tmux/plugins/tpm/tpm'

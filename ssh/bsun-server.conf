# Included from ~/.ssh/config by install.sh (managed in ~/dotfiles).

# Interactive sessions (srv, srvm): keepalives only. No port forwards here,
# so closing or dropping a session can never take a tunnel down with it.
Host bsun-server
  ServerAliveInterval 30
  ServerAliveCountMax 4

# Dedicated port-forward connection, started by srvm and stopped when it exits.
# The mini's dev ports appear as http://localhost:<port> on the laptop.
Host bsun-tunnel
  HostName bsun-server
  User lucky
  LocalForward 3000  localhost:3000     # Next.js / most Node dev servers
  LocalForward 5173  localhost:5173     # Vite
  LocalForward 8000  localhost:8000     # Python (Django, FastAPI, http.server)
  LocalForward 54321 localhost:54321    # local Supabase API
  LocalForward 54323 localhost:54323    # local Supabase Studio
  ExitOnForwardFailure yes              # exit (so srvm retries it) if a forward can't bind
  ServerAliveInterval 15                # notice a dead link within ~1 minute
  ServerAliveCountMax 4
  TCPKeepAlive yes
  ControlMaster no
  RequestTTY no
